<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Workm Planner Neon Ultimate Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --c1: #00fff6; --c2: #ff00e6; --c3: #4d7fff; --c4: #ffe14d;
  --ok: #39ff9a; --bad: #ff3b6b; --text: #f7ffff; --muted: #c9e7ff;
  --glass: rgba(6, 10, 28, 0.62); --line: rgba(0, 255, 246, 0.45);
  --head: 60px; --nav: 66px; --side: 260px; --hour: 60px; --start: 7; --hours: 14;
}
body.theme-magenta { --c1:#ff4ad8; --c2:#00e5ff; --c3:#b44aff; --line:rgba(255,74,216,.5); }
body.theme-matrix { --c1:#39ff14; --c2:#00ffd0; --c3:#baff39; --line:rgba(57,255,20,.45); }
body.theme-gold { --c1:#ffd000; --c2:#ff7a00; --c3:#fff1a8; --line:rgba(255,208,0,.5); }
body.theme-ice { --c1:#9be7ff; --c2:#6d7bff; --c3:#ffffff; --line:rgba(155,231,255,.5); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  font-family: Rajdhani, 'Segoe UI', sans-serif;
  color: var(--text);
  overflow: hidden;
  background: linear-gradient(270deg, #00fff0, #2457ff, #ff00ea, #00fff0);
  background-size: 800% 800%;
  animation: gradientBG 14s ease infinite;
}
@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
body::after {
  content: ""; pointer-events: none; position: fixed; inset: 0; z-index: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.12) 3px 4px),
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 40%);
  mix-blend-mode: overlay;
}
#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#shell { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
button, input, select, textarea { font-family: inherit; color: var(--text); }
button { cursor: pointer; }
.neon {
  text-shadow: 0 0 8px var(--c1), 0 0 18px var(--c2);
}
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: 0 0 24px rgba(0,255,246,.18), inset 0 0 24px rgba(255,0,230,.08);
  backdrop-filter: blur(16px);
}

#topHeader {
  height: var(--head); display: flex; align-items: center; gap: 10px;
  padding: 0 12px; background: rgba(4,8,22,.55); border-bottom: 1px solid var(--line);
}
#hamburger {
  width: 42px; height: 42px; border-radius: 12px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 5px;
  background: rgba(0,0,0,.25); border: 1px solid var(--line);
}
#hamburger .bar { width: 18px; height: 2px; background: var(--c1); box-shadow: 0 0 8px var(--c1); transition: .25s; }
#hamburger.open .bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
#hamburger.open .bar:nth-child(2) { opacity: 0; }
#hamburger.open .bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.brand h1 { font-family: Orbitron, sans-serif; font-size: 15px; letter-spacing: 1px; }
.brand small { display: block; opacity: .85; font-size: 11px; }
.grow { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.search {
  width: min(280px, 36vw); padding: 8px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(0,0,0,.35); outline: none;
}
.clock { font-family: Orbitron, sans-serif; font-size: 13px; color: var(--c1); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--c1), var(--c2)); color: #041018; font-weight: 800;
}

#app { flex: 1; display: flex; min-height: 0; }
#sidebar {
  width: var(--side); padding: 16px 12px; overflow: auto; flex-shrink: 0;
  background: rgba(4,8,22,.48); border-inline-end: 1px solid var(--line);
}
#sidebar h2 { font-family: Orbitron, sans-serif; font-size: 11px; letter-spacing: 2px; margin: 0 8px 12px; color: var(--c1); }
#sidebar button {
  width: 100%; text-align: start; margin-bottom: 8px; padding: 11px 12px; border-radius: 14px;
  border: 1px solid transparent; background: rgba(0,0,0,.22); font-size: 15px; font-weight: 700;
  display: flex; gap: 10px; align-items: center;
}
#sidebar button:hover, #sidebar button.active {
  border-color: var(--c1); box-shadow: 0 0 18px rgba(0,255,246,.25);
  background: linear-gradient(90deg, rgba(0,255,246,.18), rgba(255,0,230,.16));
}
#main { flex: 1; overflow: auto; padding: 16px; }
#pageContent { max-width: 1360px; margin: 0 auto; }

#bottomNav {
  height: var(--nav); display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(4,8,22,.7); border-top: 1px solid var(--line);
}
#bottomNav button { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 12px; }
#bottomNav button.active { color: var(--c1); text-shadow: 0 0 12px var(--c1); }

.hero { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.hero h2 { font-size: 28px; }
.muted { color: var(--muted); }
.grid4, .grid3, .grid2 { display: grid; gap: 12px; }
.grid4 { grid-template-columns: repeat(4, 1fr); }
.grid3 { grid-template-columns: repeat(3, 1fr); }
.grid2 { grid-template-columns: 1.3fr .7fr; }
.card { border-radius: 18px; padding: 14px; }
.stat b { display: block; font-family: Orbitron, sans-serif; font-size: 22px; color: var(--c1); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.tab, .btn, .ghost, .danger, .chip {
  border: 1px solid var(--line); background: rgba(0,0,0,.28); border-radius: 12px;
  padding: 8px 12px; font-weight: 700;
}
.tab.active, .btn {
  background: linear-gradient(90deg, rgba(0,255,246,.28), rgba(255,0,230,.22));
  box-shadow: 0 0 16px rgba(0,255,246,.2);
}
.danger { border-color: var(--bad); color: #ffd6e0; background: rgba(255,59,107,.16); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input, select, textarea {
  background: rgba(0,0,0,.38); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; outline: none;
}
label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }

.tt-wrap { overflow: auto; border-radius: 16px; }
.tt-head, .tt-row {
  display: grid; grid-template-columns: 64px repeat(7, minmax(110px, 1fr)); min-width: 920px;
}
.tt-head { position: sticky; top: 0; z-index: 3; background: rgba(4,8,22,.92); }
.tt-head > div, .time-lab { padding: 10px 6px; text-align: center; font-weight: 800; border-bottom: 1px solid var(--line); }
.tt-head .today { color: var(--c1); box-shadow: inset 0 -3px 0 var(--c1); }
.tracks {
  display: grid; grid-template-columns: 64px repeat(7, minmax(110px, 1fr));
  min-width: 920px; position: relative;
}
.time-lab { font-family: Orbitron, sans-serif; font-size: 10px; height: var(--hour); display: grid; place-items: start center; opacity: .85; }
.track { position: relative; border-inline-start: 1px solid rgba(255,255,255,.12); height: calc(var(--hour) * var(--hours)); }
.slot { height: var(--hour); border-bottom: 1px dashed rgba(255,255,255,.12); cursor: pointer; }
.slot:hover { background: rgba(255,255,255,.08); }
.block {
  position: absolute; inset-inline: 4px; border-radius: 10px; padding: 6px 8px; overflow: hidden;
  cursor: pointer; border: 1px solid #fff; color: #041018; font-weight: 700; font-size: 12px;
  box-shadow: 0 0 18px rgba(255,255,255,.25);
}
.block small { display: block; font-weight: 600; opacity: .85; }
.tracks-inner { display: contents; }
.nowline { position: absolute; inset-inline-start: 64px; inset-inline-end: 0; height: 2px; background: #fff; box-shadow: 0 0 12px #fff; z-index: 2; pointer-events: none; grid-column: 1 / -1; }
.nowline::before { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; top: -4px; inset-inline-start: -4px; }
.block.dark-text { color: #041018; }
.block.light-text { color: #f7ffff; }

.list .item {
  display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.12); margin-bottom: 8px; background: rgba(0,0,0,.18);
}
.pri-high { box-shadow: inset 3px 0 0 var(--bad); }
.pri-med { box-shadow: inset 3px 0 0 var(--c4); }
.pri-low { box-shadow: inset 3px 0 0 var(--ok); }
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.note { min-height: 140px; border-radius: 14px; padding: 12px; color: #1a1020; font-weight: 700; }
.note textarea { width: 100%; height: 90px; background: transparent; border: 0; color: inherit; resize: none; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal b, .daycell { text-align: center; padding: 8px 4px; border-radius: 10px; }
.daycell { background: rgba(0,0,0,.2); border: 1px solid transparent; cursor: pointer; min-height: 64px; }
.daycell.on { border-color: var(--c1); }
.daycell .dots { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
.daycell .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c1); display: block; }

.prayer {
  display: grid; grid-template-columns: 28px 1fr auto 130px; gap: 10px; align-items: center;
  padding: 12px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 8px;
}
.nextbig { text-align: center; padding: 18px; }
.nextbig .t { font-family: Orbitron, sans-serif; font-size: clamp(28px, 7vw, 52px); color: var(--c1); }
.tasbih { text-align: center; }
.tasbih button.round {
  width: 160px; height: 160px; border-radius: 50%; margin: 12px auto; display: grid; place-items: center;
  font-family: Orbitron, sans-serif; font-size: 36px; border: 3px solid var(--c1);
  box-shadow: 0 0 30px var(--c1); background: rgba(0,0,0,.35);
}

.sw { text-align: center; padding: 20px; }
.led { font-family: Orbitron, sans-serif; font-size: clamp(34px, 8vw, 68px); color: var(--c1); margin: 10px 0 16px; }
.calc { max-width: 380px; margin: 0 auto; }
.calc-disp { font-family: Orbitron, sans-serif; font-size: 30px; text-align: end; padding: 16px; min-height: 74px; border-radius: 14px; background: rgba(0,0,0,.4); border: 1px solid var(--line); margin-bottom: 10px; word-break: break-all; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-grid button { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.28); font-size: 20px; font-weight: 800; }
.calc-grid .op { color: var(--c1); }
.calc-grid .eq { background: linear-gradient(135deg, rgba(0,255,246,.35), rgba(255,0,230,.3)); }
.calc-grid .zero { grid-column: span 2; }
.hist { max-height: 160px; overflow: auto; font-size: 14px; }

.lang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.lang-card { text-align: center; padding: 22px 10px; cursor: pointer; }
.lang-card.active { outline: 2px solid var(--c1); box-shadow: 0 0 22px rgba(0,255,246,.3); }
.theme-dot { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #fff3; cursor: pointer; }
.fab {
  position: fixed; inset-inline-end: 18px; bottom: calc(var(--nav) + 18px); z-index: 6;
  width: 58px; height: 58px; border-radius: 50%; border: 0; font-size: 30px;
  background: linear-gradient(135deg, var(--c1), var(--c2)); color: #041018; font-weight: 800;
  box-shadow: 0 0 24px var(--c1);
}
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { width: min(560px, 100%); border-radius: 18px; padding: 16px; background: rgba(8,12,30,.92); border: 1px solid var(--line); max-height: 90vh; overflow: auto; }
#toasts { position: fixed; top: 70px; inset-inline-end: 14px; z-index: 30; display: grid; gap: 8px; }
.toast { background: rgba(8,12,30,.95); border: 1px solid var(--c1); padding: 10px 12px; border-radius: 12px; min-width: 200px; }
.lock { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(4,8,22,.86); }
.lock.show { display: grid; }
.overlay { display: none; position: fixed; inset: var(--head) 0 var(--nav) 0; background: rgba(0,0,0,.45); z-index: 8; }
.empty { text-align: center; padding: 28px 10px; }
@media (max-width: 980px) {
  .grid4, .grid3, .grid2 { grid-template-columns: 1fr; }
  .search { display: none; }
  #sidebar { position: fixed; top: var(--head); bottom: var(--nav); inset-inline-start: 0; z-index: 9; transform: translateX(-110%); transition: .28s; }
  html[dir=rtl] #sidebar { transform: translateX(110%); }
  #sidebar.open, html[dir=rtl] #sidebar.open { transform: none; }
  .overlay.show { display: block; }
}
@media (min-width: 981px) {
  #bottomNav { display: none; }
  body { --nav: 0px; }
  .fab { bottom: 18px; }
}
@media print {
  #topHeader, #sidebar, #bottomNav, .fab, .tabs, .no-print, #fx { display: none !important; }
  body { animation: none; background: #000; overflow: visible; }
  #app, #main, #shell { height: auto; overflow: visible; display: block; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="shell">
  <div id="topHeader">
    <div id="hamburger" onclick="toggleSidebar()"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    <div class="brand">
      <h1 class="neon">WORKM PLANNER</h1>
      <small id="tagline">Neon Ultimate Pro</small>
    </div>
    <div class="grow">
      <input class="search" id="searchBox" placeholder="Search schedule, tasks, notes..." onkeydown="if(event.key==='Enter') runSearch(this.value)">
      <div class="clock" id="liveClock">00:00:00</div>
      <div class="avatar" id="avatarBtn" onclick="showContent('profile')">W</div>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <div id="app">
    <aside id="sidebar">
      <h2 id="optTitle">OPTIONS</h2>
      <button data-page="home" onclick="showContent('home')">▦ <span data-i18n="home">Home</span></button>
      <button data-page="religion" onclick="showContent('religion')">☪ <span data-i18n="religion">Religion Schedule</span></button>
      <button data-page="language" onclick="showContent('language')">文 <span data-i18n="language">Language</span></button>
      <button data-page="stopwatch" onclick="showContent('stopwatch')">⏱ <span data-i18n="clocks">Clocks & Focus</span></button>
      <button data-page="calculator" onclick="showContent('calculator')">∑ <span data-i18n="calculator">Calculator</span></button>
      <button onclick="exportTimetable()">⬇ <span data-i18n="export">Export JSON</span></button>
      <button onclick="exportCSV()">⬇ <span data-i18n="csv">Export CSV</span></button>
      <button onclick="importTimetable()">⬆ <span data-i18n="import">Import</span></button>
      <button class="no-print" onclick="window.print()">⎙ <span data-i18n="print">Print</span></button>
      <button data-page="profile" onclick="showContent('profile')">◉ <span data-i18n="profile">Profile</span></button>
    </aside>
    <main id="main"><div id="pageContent"></div></main>
  </div>
  <nav id="bottomNav">
    <button data-page="home" onclick="showContent('home')"><span data-i18n="home">Home</span></button>
    <button data-page="stopwatch" onclick="showContent('stopwatch')"><span data-i18n="clocks">Focus</span></button>
    <button data-page="calculator" onclick="showContent('calculator')"><span data-i18n="calculator">Calc</span></button>
    <button data-page="profile" onclick="showContent('profile')"><span data-i18n="profile">Me</span></button>
  </nav>
</div>
<button class="fab no-print" id="fab" onclick="quickAdd()">+</button>
<div class="modal-bg" id="modalRoot" onclick="if(event.target===this) closeModal()"><div class="modal glass" id="modalBox"></div></div>
<div id="toasts"></div>
<div class="lock" id="lockScreen">
  <div class="glass card" style="width:min(360px,92vw);text-align:center">
    <h2 class="neon">WORKM</h2>
    <p class="muted" style="margin:8px 0 12px">Enter PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:8px" onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" style="width:100%;margin-top:12px" onclick="unlock()">Unlock</button>
  </div>
</div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const KEY = 'workm-planner-v2';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const I18N = {
  en: {
    home:'Home', religion:'Religion Schedule', language:'Language', clocks:'Clocks & Focus',
    calculator:'Calculator', export:'Export JSON', csv:'Export CSV', import:'Import', print:'Print',
    profile:'Profile', options:'OPTIONS', tagline:'Manage every hour. Keep the glow.',
    morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening',
    today:'Today', week:'Week', month:'Month', tasks:'Tasks', notes:'Notes', schedule:'Schedule',
    add:'Add block', addTask:'Add task', addNote:'Add note', save:'Save', cancel:'Cancel', delete:'Delete',
    title:'Title', start:'Start', end:'End', room:'Room / place', person:'Person / teacher',
    color:'Color', day:'Day', repeat:'Every week', notesF:'Notes', noEvents:'Empty grid. Tap a slot or load a demo week.',
    demo:'Load demo week', search:'Search', done:'Done', next:'Next up', now:'Now',
    work:'Work', study:'Study', personal:'Personal', health:'Health', religionCat:'Religion', other:'Other', break:'Break',
    prayers:'Prayers', nextPrayer:'Next prayer', tasbih:'Tasbih', customRel:'Custom ibadah',
    chooseLang:'Language', name:'Name', hours:'Visible hours', theme:'Neon theme', notif:'Remind 5 min before',
    sound:'Interface sounds', pin:'Lock PIN (4-6 digits)', clear:'Clear all data', saved:'Saved',
    exported:'Exported', imported:'Imported', invalid:'Invalid file', startSw:'Start', pause:'Pause',
    lap:'Lap', reset:'Reset', timer:'Timer', pomodoro:'Pomodoro', alarms:'Alarms',
    focus:'Focus', shortBr:'Break', history:'History', high:'High', med:'Medium', low:'Low',
    habits:'Habits', quote:'Stay on the block. Finish what you started.', streak:'Prayer streak',
    csvOk:'CSV downloaded', pinOn:'PIN saved', unlocked:'Welcome back', addAlarm:'Add alarm',
    minutes:'Minutes', edit:'Edit block', remaining:'Left today', completed:'Completed',
    stats:'This week', clearLaps:'Clear laps', setTimer:'Set', subject:'Subject / block',
    stopwatch:'Stopwatch', noResults:'No matches'
  }
};
I18N.ar = Object.assign({}, I18N.en, {
  home:'الرئيسية', religion:'الجدول الديني', language:'اللغة', clocks:'التركيز والساعات',
  calculator:'آلة حاسبة', export:'تصدير JSON', csv:'تصدير CSV', import:'استيراد', print:'طباعة',
  profile:'الملف', options:'الخيارات', tagline:'نظّم كل ساعة.', today:'اليوم', week:'الأسبوع',
  month:'الشهر', tasks:'المهام', notes:'الملاحظات', schedule:'الجدول', add:'إضافة حصة',
  addTask:'مهمة', addNote:'ملاحظة', save:'حفظ', cancel:'إلغاء', delete:'حذف', prayers:'الصلوات',
  nextPrayer:'الصلاة التالية', tasbih:'التسبيح', chooseLang:'اللغة', demo:'أسبوع تجريبي'
});
I18N.ur = Object.assign({}, I18N.en, {
  home:'ہوم', religion:'مذہبی شیڈول', language:'زبان', clocks:'فوکس اور گھڑیاں',
  calculator:'کیلکولیٹر', export:'ایکسپورٹ JSON', csv:'ایکسپورٹ CSV', import:'امپورٹ', print:'پرنٹ',
  profile:'پروفائل', options:'آپشنز', tagline:'ہر گھنٹہ سنبھالیں۔', today:'آج', week:'ہفتہ',
  month:'مہینہ', tasks:'کام', notes:'نوٹس', schedule:'ٹائم ٹیبل', add:'بلاک شامل کریں',
  addTask:'ٹاسک', addNote:'نوٹ', save:'محفوظ', cancel:'منسوخ', delete:'حذف', prayers:'نمازیں',
  nextPrayer:'اگلی نماز', tasbih:'تسبیح', chooseLang:'زبان', demo:'ڈیمو ہفتہ'
});

const defaultState = () => ({
  profile: { name:'', lang:'en', theme:'cyber', notif:false, sound:true, pin:'', hourStart:7, hourEnd:21, fmt24:true },
  events: [], tasks: [], notes: [], habits: [
    { id:'h1', title:'Wake on time', log:{} },
    { id:'h2', title:'Deep work', log:{} },
    { id:'h3', title:'No late night scroll', log:{} }
  ],
  prayers: { fajr:'05:15', dhuhr:'12:30', asr:'16:05', maghrib:'18:48', isha:'20:12' },
  prayerLog: {}, customReligion: [], alarms: [], calcHistory: [], tasbih: 0, homeTab: 'schedule'
});

let state = loadState();
let page = 'home';
let monthCursor = new Date();
let selectedDay = todayISO();
let sw = { ms:0, run:false, t0:0, laps:[], int:null };
let timer = { left:25*60, run:false, int:null, total:25*60, mode:'timer' };
let pomo = { left:25*60, run:false, int:null, phase:'focus', cycles:0 };
let calc = { display:'0', acc:null, op:null, fresh:false };
let clockTab = 'stopwatch';

function loadState() {
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('workm-planner-v1');
    if (!raw) return defaultState();
    const s = { ...defaultState(), ...JSON.parse(raw) };
    s.profile = { ...defaultState().profile, ...(s.profile||{}) };
    ['events','tasks','notes','habits','alarms','customReligion'].forEach(k => { if (!Array.isArray(s[k])) s[k] = defaultState()[k]; });
    return s;
  } catch { return defaultState(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function t(k) { return (I18N[state.profile.lang]||I18N.en)[k] ?? I18N.en[k] ?? k; }
function esc(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
function pad(n,z=2){ return String(n).padStart(z,'0'); }
function todayISO(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function minutes(tt){ const p=String(tt||'00:00').split(':'); return (Number(p[0])||0)*60+(Number(p[1])||0); }
function fromMin(m){ m=((m%1440)+1440)%1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function hhmm(tt){ return fromMin(minutes(tt)); }
function dow(iso){ const d=new Date(iso+'T00:00:00'); return Number.isNaN(d.getTime())?0:(d.getDay()+6)%7; }
function contrast(bg){
  const h=String(bg||'#00fff6').replace('#','');
  const hex=h.length===3?h.split('').map(c=>c+c).join(''):h.slice(0,6);
  const n=parseInt(hex,16); if(Number.isNaN(n)) return 'dark-text';
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (r*299+g*587+b*114)/1000>148?'dark-text':'light-text';
}
function val(id){ return document.getElementById(id); }
function beep(freq=880, ms=180) {
  if (!state.profile.sound) return;
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.08, ac.currentTime);
    o.start(); setTimeout(() => { o.stop(); ac.close(); }, ms);
  } catch {}
}
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(),2500); }
function period(){ const h=new Date().getHours(); return h<12?t('morning'):h<17?t('afternoon'):t('evening'); }
function hourCfg(){
  let s=Number(state.profile.hourStart); if(!Number.isFinite(s)) s=7;
  let e=Number(state.profile.hourEnd); if(!Number.isFinite(e)) e=21;
  s=Math.min(18, Math.max(0, s)); e=Math.min(24, Math.max(s+1, e));
  return { start:s, hours:e-s };
}

function eventsOn(iso){
  const d=dow(iso);
  return state.events.filter(e => (e.repeat || e.recurring) ? e.dow===d : e.date===iso).sort((a,b)=>minutes(a.start)-minutes(b.start));

    const d=new Date(); const diff=(d.getDay()===0?-6:1-d.getDay())+i; const x=new Date(d); x.setDate(d.getDate()+diff);
    const iso=todayISO(x); return { iso, dow:i, list: eventsOn(iso) };
  });
}

function tickCountdown(current, next){
  const target = next? minutes(next.start) : current? minutes(current.end) : null;

  const now=new Date().getHours()*60+new Date().getMinutes();
  let d=target-now; if (d<0) d=0;
  el.textContent=`${pad(Math.floor(d/60))}:${pad(d%60)}`;
}

function nextPrayer(){
  const now=new Date().getHours()*60+new Date().getMinutes();
  const order=['fajr','dhuhr','asr','maghrib','isha'];
  for (const k of order) if (minutes(state.prayers[k])>now) return { k, t:state.prayers[k] };
  return { k:'fajr', t:state.prayers.fajr, tomorrow:true };
}
function prayerStreak(){
  let n=0; for (let i=0;i<30;i++){
    const d=new Date(); d.setDate(d.getDate()-i); const iso=todayISO(d);
    const log=state.prayerLog[iso]||{};
    if (['fajr','dhuhr','asr','maghrib','isha'].every(k=>log[k])) n++; else if (i>0) break;
  } return n;
}
function renderReligion(root){
  const names={ fajr:'Fajr', dhuhr:'Dhuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };
  const today=todayISO(); state.prayerLog[today]=state.prayerLog[today]||{};
  const log=state.prayerLog[today];
  const done=Object.keys(names).filter(k=>log[k]).length;
  const np=nextPrayer();
  root.innerHTML=`
    <div class="hero"><div><h2 class="neon">${t('religion')}</h2><p class="muted">${hijri()} · ${t('streak')}: ${prayerStreak()}d</p></div></div>
    <div class="grid2">
      <div class="glass card nextbig">
        <div class="muted">${t('nextPrayer')}</div>
        <h3>${names[np.k]}${np.tomorrow?' +1':''}</h3>
        <div class="t">${np.t}</div>
        <p class="muted">${done}/5 ${t('done')}</p>
      </div>
      <div class="glass card tasbih">
        <h3>${t('tasbih')}</h3>
        <button class="round" onclick="tasbihTap()">${state.tasbih%33|| (state.tasbih?33:0)}</button>
        <p class="muted">${state.tasbih} · 33 / 99</p>
        <button class="ghost" onclick="state.tasbih=0;save();showContent('religion')">${t('reset')}</button>
      </div>
    </div>
    <div class="glass card" style="margin-top:12px">
      ${Object.keys(names).map(k=>`
        <div class="prayer">
          <input type="checkbox" ${log[k]?'checked':''} onchange="togglePrayer('${k}', this.checked)">
          <strong>${names[k]}</strong>
          <span class="muted">${k===np.k?t('next'):''}</span>
          <input type="time" value="${esc(state.prayers[k])}" onchange="state.prayers['${k}']=this.value;save()">
        </div>`).join('')}
    </div>
    <div class="glass card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><h3>${t('customRel')}</h3><button class="btn" onclick="addCustomRel()">+</button></div>
      ${(state.customReligion||[]).map(c=>`<div class="item">
        <input value="${esc(c.title)}" onchange="updRel('${c.id}','title',this.value)" style="flex:1">
        <input type="time" value="${esc(c.time)}" onchange="updRel('${c.id}','time',this.value)">
        <button class="danger" onclick="delRel('${c.id}')">×</button>
      </div>`).join('') || `<p class="empty">${t('customRel')}</p>`}
    </div>`;
}
function tasbihTap(){ state.tasbih++; save(); beep(660,50); showContent('religion'); if (state.tasbih%33===0) beep(990,200); }
function togglePrayer(k,v){ const d=todayISO(); state.prayerLog[d]=state.prayerLog[d]||{}; state.prayerLog[d][k]=v; save(); showContent('religion'); }
function addCustomRel(){ state.customReligion.push({id:uid(), title:t('customRel'), time:'21:00'}); save(); showContent('religion'); }
function updRel(id,f,v){ const c=state.customReligion.find(x=>x.id===id); if(c){ c[f]=v; save(); } }
function delRel(id){ state.customReligion=state.customReligion.filter(x=>x.id!==id); save(); showContent('religion'); }

function renderClocks(root){
  root.innerHTML=`<div class="tabs">${['stopwatch','timer','pomodoro','alarms'].map(k=>`<button class="tab ${clockTab===k?'active':''}" onclick="clockTab='${k}';showContent('stopwatch')">${t(k)}</button>`).join('')}</div>
    <div class="glass card sw" id="clockBody"></div>`;
  const el=root.querySelector('#clockBody');
  if (clockTab==='stopwatch') el.innerHTML=`
    <div class="led" id="swTime">${fmtSw(sw.ms)}</div>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="toggleSw()">${sw.run?t('pause'):t('startSw')}</button>
      <button class="ghost" onclick="lapSw()">${t('lap')}</button>
      <button class="danger" onclick="resetSw()">${t('reset')}</button>
    </div>
    <div class="list" style="max-width:420px;margin:16px auto 0">${sw.laps.map((l,i)=>`<div class="item"><span>#${sw.laps.length-i}</span><b style="margin-inline-start:auto">${fmtSw(l)}</b></div>`).join('')}</div>`;
  if (clockTab==='timer') el.innerHTML=`
    <div class="led" id="tmTime">${fmtSec(timer.left)}</div>
    <div class="row" style="justify-content:center">
      <input id="tmMin" type="number" min="1" max="180" value="${Math.round(timer.total/60)}" style="width:90px"> ${t('minutes')}
      <button class="btn" onclick="setTimer()">${t('setTimer')}</button>
      <button class="btn" onclick="toggleTimer()">${timer.run?t('pause'):t('startSw')}</button>
      <button class="danger" onclick="resetTimer()">${t('reset')}</button>
    </div>`;
  if (clockTab==='pomodoro') el.innerHTML=`
    <p class="muted">${t(pomo.phase==='focus'?'focus':'shortBr')} · ${pomo.cycles}x</p>
    <div class="led" id="pmTime">${fmtSec(pomo.left)}</div>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="togglePomo()">${pomo.run?t('pause'):t('startSw')}</button>
      <button class="danger" onclick="resetPomo()">${t('reset')}</button>
    </div>`;
  if (clockTab==='alarms') el.innerHTML=`
    <div class="row" style="justify-content:center;margin-bottom:12px">
      <input id="alTime" type="time" value="06:30"><input id="alLab" placeholder="${t('title')}" style="min-width:140px">
      <button class="btn" onclick="addAlarm()">${t('addAlarm')}</button>
    </div>
    <div class="list">${state.alarms.map(a=>`<div class="item">
      <input type="checkbox" ${a.on?'checked':''} onchange="aOn('${a.id}', this.checked)">
      <b>${a.time}</b> <span>${esc(a.label)}</span>
      <button class="danger" style="margin-inline-start:auto" onclick="delAlarm('${a.id}')">×</button>
    </div>`).join('') || `<p class="empty">${t('alarms')}</p>`}</div>`;
}
function fmtSw(ms){ const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000); return `${pad(h)}:${pad(m)}:${pad(s)}.${pad(cs)}`; }
function fmtSec(s){ s=Math.max(0,s|0); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }
function toggleSw(){
  if (sw.run){ sw.run=false; sw.ms=Date.now()-sw.t0; clearInterval(sw.int); }
  else {
    clearInterval(sw.int);
    sw.run=true; sw.t0=Date.now()-sw.ms;
    sw.int=setInterval(()=>{ if(!sw.run) return; sw.ms=Date.now()-sw.t0; const e=val('swTime'); if(e) e.textContent=fmtSw(sw.ms); },30);
  }
  if (page==='stopwatch' && clockTab==='stopwatch') showContent('stopwatch');
}
function lapSw(){ if(sw.ms){ sw.laps.unshift(sw.ms); if (page==='stopwatch') showContent('stopwatch'); } }
function resetSw(){ sw.run=false; clearInterval(sw.int); sw.ms=0; sw.t0=0; sw.laps=[]; sw.int=null; if (page==='stopwatch') showContent('stopwatch'); }
function setTimer(){
  const m=Math.min(180, Math.max(1, Number(val('tmMin')?.value||25)));
  clearInterval(timer.int); timer.run=false; timer.total=m*60; timer.left=m*60;
  if (page==='stopwatch') showContent('stopwatch');
}
function toggleTimer(){
  if (timer.run){ timer.run=false; clearInterval(timer.int); }
  else {
    clearInterval(timer.int); timer.run=true;
    timer.int=setInterval(()=>{
      if(!timer.run) return;
      timer.left--; const e=val('tmTime'); if(e) e.textContent=fmtSec(timer.left);
      if(timer.left<=0){ timer.run=false; timer.left=0; clearInterval(timer.int); beep(440,400); beep(880,400); toast(t('timer')); if(page==='stopwatch'&&clockTab==='timer') showContent('stopwatch'); }
    },1000);
  }
  if (page==='stopwatch') showContent('stopwatch');
}
function resetTimer(){ timer.run=false; clearInterval(timer.int); timer.left=timer.total; if (page==='stopwatch') showContent('stopwatch'); }
function togglePomo(){
  if (pomo.run){ pomo.run=false; clearInterval(pomo.int); }
  else {
    clearInterval(pomo.int); pomo.run=true;
    pomo.int=setInterval(()=>{
      if(!pomo.run) return;
      pomo.left--; const e=val('pmTime'); if(e) e.textContent=fmtSec(pomo.left);
      if (pomo.left<=0){
        beep(520,300); beep(880,300);
        if (pomo.phase==='focus'){ pomo.phase='break'; pomo.left=5*60; pomo.cycles++; toast(t('shortBr')); }
        else { pomo.phase='focus'; pomo.left=25*60; toast(t('focus')); }
        if (page==='stopwatch' && clockTab==='pomodoro') showContent('stopwatch');
      }
    },1000);
  }
  if (page==='stopwatch') showContent('stopwatch');
}
function resetPomo(){ pomo.run=false; clearInterval(pomo.int); pomo.left=25*60; pomo.phase='focus'; pomo.cycles=0; pomo.int=null; if (page==='stopwatch') showContent('stopwatch'); }
function addAlarm(){ const time=document.getElementById('alTime').value; const label=document.getElementById('alLab').value||'Alarm'; state.alarms.push({id:uid(), time, label, on:true, last:''}); save(); showContent('stopwatch'); }
function aOn(id,v){ const a=state.alarms.find(x=>x.id===id); if(a){ a.on=v; save(); } }
function delAlarm(id){ state.alarms=state.alarms.filter(a=>a.id!==id); save(); showContent('stopwatch'); }

function renderCalc(root){
  const keys=[['C','±','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['0','.','=']];
  root.innerHTML=`<div class="calc glass card">
    <div class="calc-disp" id="calcDisplay">${esc(calc.display)}</div>
    <div class="calc-grid">${keys.flat().map(k=>{
      const cls=k==='0'?'zero':k==='='?'eq':'÷×−+%±C'.includes(k)?'op':'';
      return `<button class="${cls}" onclick="calcPress('${k}')">${k}</button>`;
    }).join('')}</div>
    <div class="hist muted" style="margin-top:10px"><b>${t('history')}</b><br>${(state.calcHistory||[]).slice(0,8).map(x=>esc(x)).join('<br>')||'—'}</div>
  </div>`;
}
function calcPress(k){
  const ops={'÷':'/','×':'*','−':'-','+':'+'};
  if(k==='C') calc={display:'0',acc:null,op:null,fresh:false};
  else if(k==='±') calc.display=String(-(parseFloat(calc.display)||0));
  else if(k==='%') calc.display=String((parseFloat(calc.display)||0)/100);
  else if(k==='.') { if(!calc.display.includes('.')) calc.display+='.'; }
  else if(ops[k]){ compute(); calc.op=ops[k]; calc.acc=parseFloat(calc.display); calc.fresh=true; }
  else if(k==='='){ const a=calc.acc, op=calc.op, b=calc.display; compute(); if(op!=null){ state.calcHistory.unshift(`${a} ${op} ${b} = ${calc.display}`); state.calcHistory=state.calcHistory.slice(0,20); save(); } calc.op=null; calc.acc=null; calc.fresh=true; }
  else { if(calc.display==='0'||calc.fresh){ calc.display=k; calc.fresh=false; } else calc.display+=k; }
  const el=document.getElementById('calcDisplay'); if(el) el.textContent=calc.display;
}
function compute(){
  if(calc.acc==null||!calc.op) return;
  const b=parseFloat(calc.display); let r=calc.acc;
  if(calc.op==='+') r+=b; if(calc.op==='-') r-=b; if(calc.op==='*') r*=b; if(calc.op==='/') r=b===0?'Error':r/b;
  calc.display=String(r==='Error'?r:Math.round((Number(r)+Number.EPSILON)*1e10)/1e10);
}

function setTheme(id){ state.profile.theme=id; save(); applyChrome(); showContent('profile'); }
function saveProfile(){
  state.profile.name=(val('pfName')?.value||'').trim();
  state.profile.hourStart=Number(val('pfS')?.value||7);
  state.profile.hourEnd=Number(val('pfE')?.value||21);
  state.profile.notif=!!val('pfN')?.checked; state.profile.sound=!!val('pfSo')?.checked;
  state.profile.pin=(val('pfPin')?.value||'').replace(/\D/g,'').slice(0,6);
  if (state.profile.notif && 'Notification' in window && Notification.permission==='default') Notification.requestPermission();
  save(); applyChrome(); toast(t('saved')); beep(700,80);
}
function clearAll(){ if(!confirm(t('clear')+'?')) return; state=defaultState(); save(); showContent('profile'); }

function exportTimetable(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
  a.download=`workm-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href); toast(t('exported'));
}
function exportCSV(){
  const rows=[['title','day','date','start','end','person','room','repeat','category']].concat(
    state.events.map(e=>[e.title, DAYS[e.dow]||'', e.date, e.start, e.end, e.person||'', e.room||'', e.repeat, e.category||''])
  );
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`workm-${todayISO()}.csv`; a.click(); toast(t('csvOk'));
}
function importTimetable(){ document.getElementById('importFile').click(); }
document.getElementById('importFile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try {
    const data=JSON.parse(await f.text());
    if (!data || typeof data!=='object' || Array.isArray(data)) throw new Error('bad');
    const base=defaultState();
    state={ ...base, ...data, profile:{ ...base.profile, ...(data.profile||{}) } };
    ['events','tasks','notes','habits','alarms','customReligion'].forEach(k => { if (!Array.isArray(state[k])) state[k]=base[k]; });
    if (!state.prayers || typeof state.prayers!=='object') state.prayers=base.prayers;
    if (!state.prayerLog || typeof state.prayerLog!=='object') state.prayerLog={};
    save(); applyChrome(); showContent(page); toast(t('imported'));
  } catch { toast(t('invalid')); }
};

function runSearch(q){
  q=(q||'').trim().toLowerCase(); if(!q) return;
  const hits=[
    ...state.events.filter(e=>`${e.title||''} ${e.person||''} ${e.room||''}`.toLowerCase().includes(q)).map(e=>({k:'event', t:e.title, id:e.id})),
    ...state.tasks.filter(e=>(e.title||'').toLowerCase().includes(q)).map(e=>({k:'task', t:e.title})),
    ...state.notes.filter(e=>(e.text||'').toLowerCase().includes(q)).map(e=>({k:'note', t:(e.text||'').slice(0,40)}))
  ].slice(0,10);
  document.getElementById('modalBox').innerHTML=`<h3>${t('search')}</h3>${hits.length? hits.map(h=>`<div class="item" onclick="${h.k==='event'?`openEventModal({id:'${h.id}'})`:`closeModal();state.homeTab='${h.k==='task'?'tasks':'notes'}';showContent('home')`}"><b>${esc(h.k)}</b> ${esc(h.t)}</div>`).join('') : `<p class="empty">${t('noResults')}</p>`}
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`;
  document.getElementById('modalRoot').classList.add('show');
}

function unlock(){
  const v=document.getElementById('pinIn').value;
  if (v===state.profile.pin){ document.getElementById('lockScreen').classList.remove('show'); toast(t('unlocked')); }
  else beep(180,200);
}

function tickClock(){
  const n=new Date();
  document.getElementById('liveClock').textContent=n.toLocaleTimeString(document.documentElement.lang, { hour12: !state.profile.fmt24 });
  const hm=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const iso=todayISO(n);
  state.alarms.forEach(a=>{
    if (a.on && hhmm(a.time)===hm && a.last!==iso){ a.last=iso; save(); beep(880,250); beep(660,250); toast(a.label||t('alarms'));
      if ('Notification' in window && Notification.permission==='granted') new Notification('Workm', { body: a.label||a.time });
    }
  });
  if (state.profile.notif && 'Notification' in window && Notification.permission==='granted'){
    const soon=n.getHours()*60+n.getMinutes()+5;
    eventsOn(iso).forEach(ev=>{
      if (minutes(ev.start)===soon){
        const k='n'+iso+ev.id; if (!tickClock._n) tickClock._n=new Set();
        if (!tickClock._n.has(k)){ tickClock._n.add(k); new Notification(ev.title, { body: ev.start }); beep(920,180); }
      }
    });
  }
}
setInterval(tickClock, 1000); tickClock();

(function particles(){
  const c=document.getElementById('fx'); if(!c || !c.getContext) return;
  const x=c.getContext('2d'); if(!x) return;
  let w,h, ps;
  function resize(){ w=c.width=innerWidth; h=c.height=innerHeight; ps=Array.from({length:40},()=>({x:Math.random()*w,y:Math.random()*h,v:0.3+Math.random()*0.8,r:1+Math.random()*2})); }
  addEventListener('resize', resize); resize();
  (function loop(){
    x.clearRect(0,0,w,h); x.fillStyle='rgba(255,255,255,.55)';
    (ps||[]).forEach(p=>{ p.y-=p.v; if(p.y<0){ p.y=h; p.x=Math.random()*w; } x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    requestAnimationFrame(loop);
  })();
})();

function welcomeGo(demo){
  state.profile.name=(val('welcomeName')?.value||'Planner').trim()||'Planner';
  save(); closeModal();
  if (demo) loadDemo(); else showContent('home');
}

if (state.profile.pin) document.getElementById('lockScreen').classList.add('show');
if (!state.profile.name && !state.profile.pin) {
  setTimeout(()=>{
    document.getElementById('modalBox').innerHTML=`<h3 class="neon">WORKM PLANNER</h3>
      <p class="muted" style="margin:8px 0 12px">${t('quote')}</p>
      <label>${t('name')}<input id="welcomeName" placeholder="Your name" onkeydown="if(event.key==='Enter')welcomeGo(false)"></label>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="welcomeGo(false)">${t('save')}</button>
        <button class="ghost" onclick="welcomeGo(true)">${t('demo')}</button>
      </div>`;
    document.getElementById('modalRoot').classList.add('show');
  }, 200);
}

applyChrome();
showContent('home');
