<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workm Planner Neon Ultimate Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070f;
  --panel: rgba(10, 14, 32, 0.78);
  --panel-solid: #0c1024;
  --line: rgba(0, 245, 255, 0.22);
  --text: #f4fbff;
  --muted: #9bb0c8;
  --cyan: #00f5ff;
  --magenta: #ff2bd6;
  --violet: #8b5cff;
  --green: #00ff9d;
  --gold: #ffd166;
  --danger: #ff4d6d;
  --header-h: 58px;
  --nav-h: 64px;
  --sidebar-w: 250px;
  --hour-h: 56px;
  --start-hour: 6;
  --hours: 16;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  font-family: 'Outfit', 'Segoe UI', sans-serif;
  color: var(--text);
  background: #07070f;
  overflow: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(0, 245, 255, 0.18), transparent 55%),
    radial-gradient(800px 500px at 110% 10%, rgba(255, 43, 214, 0.16), transparent 50%),
    radial-gradient(700px 400px at 50% 120%, rgba(139, 92, 255, 0.18), transparent 55%),
    linear-gradient(270deg, #041018, #12061a, #06101c, #041018);
  background-size: auto, auto, auto, 800% 800%;
  animation: gradientBG 18s ease infinite;
}
@keyframes gradientBG {
  0% { background-position: 0 0, 0 0, 0 0, 0% 50%; }
  50% { background-position: 0 0, 0 0, 0 0, 100% 50%; }
  100% { background-position: 0 0, 0 0, 0 0, 0% 50%; }
}
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
#topHeader, #app, #bottomNav, #modalRoot, #toasts { position: relative; z-index: 1; }

#topHeader {
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: rgba(6, 8, 20, 0.72);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}
#hamburger {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
  background: rgba(0, 245, 255, 0.08); border: 1px solid var(--line);
}
#hamburger .bar {
  width: 18px; height: 2px; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan); transition: 0.25s;
}
#hamburger.open .bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
#hamburger.open .bar:nth-child(2) { opacity: 0; }
#hamburger.open .bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 {
  font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 1.2px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  white-space: nowrap;
}
.brand span { font-size: 11px; color: var(--muted); }
.header-right { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.live-clock {
  font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--cyan);
  text-shadow: 0 0 10px rgba(0,245,255,0.6);
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--cyan), var(--violet));
  color: #041018; font-weight: 700; font-size: 13px;
  box-shadow: 0 0 16px rgba(0,245,255,0.35);
}

#app { display: flex; height: calc(100% - var(--header-h) - var(--nav-h)); }
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--panel); border-inline-end: 1px solid var(--line);
  padding: 18px 12px; overflow-y: auto;
  transform: translateX(0); transition: transform 0.28s ease;
}
html[dir="rtl"] #sidebar { transform: translateX(0); }
#sidebar h2 {
  font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px;
  color: var(--cyan); margin: 4px 8px 14px;
}
#sidebar button, .ghost, .primary, .danger, .chip {
  border: 1px solid var(--line); background: rgba(0,245,255,0.06); color: var(--text);
}
#sidebar button {
  width: 100%; text-align: start; padding: 11px 12px; margin-bottom: 8px;
  border-radius: 12px; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 10px; transition: 0.2s;
}
#sidebar button:hover, #sidebar button.active {
  background: linear-gradient(90deg, rgba(0,245,255,0.16), rgba(255,43,214,0.12));
  box-shadow: 0 0 18px rgba(0,245,255,0.12); border-color: var(--cyan);
}
#main { flex: 1; overflow: auto; padding: 18px; }
#pageContent { max-width: 1280px; margin: 0 auto; }

#bottomNav {
  height: var(--nav-h);
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(6, 8, 20, 0.86);
  border-top: 1px solid var(--line); backdrop-filter: blur(16px);
}
#bottomNav button {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; font-size: 11px;
}
#bottomNav button.active { color: var(--cyan); text-shadow: 0 0 12px rgba(0,245,255,0.5); }
#bottomNav .ico { font-size: 18px; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 16px; backdrop-filter: blur(18px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { padding: 14px; }
.stat b { display: block; font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--cyan); }
.stat span { color: var(--muted); font-size: 12px; }
.greeting h2 { font-size: 26px; margin-bottom: 4px; }
.greeting p { color: var(--muted); margin-bottom: 16px; }

.week-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.week-bar h3 { flex: 1; font-size: 16px; min-width: 180px; }
.ghost, .primary, .danger {
  padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;
}
.primary {
  background: linear-gradient(90deg, rgba(0,245,255,0.25), rgba(139,92,255,0.28));
  color: #fff; border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(0,245,255,0.18);
}
.danger { background: rgba(255,77,109,0.15); border-color: var(--danger); color: #ffdce3; }

.timetable-wrap { overflow: auto; border-radius: 16px; border: 1px solid var(--line); }
.timetable {
  min-width: 860px; display: grid;
  grid-template-columns: 64px repeat(7, 1fr);
  background: rgba(5,8,20,0.55);
}
.th, .time-cell {
  position: sticky; top: 0; z-index: 3;
  background: #0b1026; border-bottom: 1px solid var(--line);
  padding: 10px 6px; text-align: center; font-size: 12px;
}
.th.today { color: var(--cyan); box-shadow: inset 0 -2px 0 var(--cyan); }
.time-cell { font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--muted); }
.day-col {
  position: relative; border-inline-start: 1px solid var(--line);
  height: calc(var(--hour-h) * var(--hours));
}
.hour-slot {
  height: var(--hour-h); border-bottom: 1px dashed rgba(0,245,255,0.08);
  cursor: pointer;
}
.hour-slot:hover { background: rgba(0,245,255,0.06); }
.event {
  position: absolute; inset-inline: 4px; border-radius: 10px; padding: 6px 8px;
  font-size: 12px; overflow: hidden; cursor: pointer; border: 1px solid transparent;
  box-shadow: 0 0 16px rgba(0,0,0,0.25);
}
.event strong { display: block; font-size: 12px; }
.event small { opacity: 0.85; }
.cat-work { background: rgba(0,245,255,0.18); border-color: var(--cyan); }
.cat-study { background: rgba(139,92,255,0.22); border-color: var(--violet); }
.cat-personal { background: rgba(255,43,214,0.18); border-color: var(--magenta); }
.cat-health { background: rgba(0,255,157,0.16); border-color: var(--green); }
.cat-religion { background: rgba(255,209,102,0.16); border-color: var(--gold); }
.cat-other { background: rgba(155,176,200,0.16); border-color: #9bb0c8; }

.agenda { margin-top: 16px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px; }
.item {
  display: flex; gap: 10px; align-items: center; padding: 10px;
  border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
  background: rgba(255,255,255,0.02);
}
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.empty { color: var(--muted); padding: 20px; text-align: center; }

.prayer {
  display: grid; grid-template-columns: 28px 1fr 120px; gap: 10px; align-items: center;
  padding: 12px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
}
.prayer input[type="time"], input, select, textarea {
  background: rgba(0,0,0,0.28); border: 1px solid var(--line); color: var(--text);
  border-radius: 10px; padding: 8px 10px; outline: none;
}
.prayer input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--cyan); }
.progress-bar { height: 10px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; margin: 8px 0 16px; }
.progress-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }

.lang-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.lang-card { text-align: center; padding: 22px 12px; cursor: pointer; }
.lang-card.active { border-color: var(--cyan); box-shadow: 0 0 22px rgba(0,245,255,0.2); }
.lang-card b { display: block; font-size: 22px; margin-bottom: 6px; }

.stopwatch { text-align: center; padding: 28px 12px; }
.sw-time {
  font-family: 'Orbitron', sans-serif; font-size: clamp(32px, 8vw, 64px);
  color: var(--cyan); text-shadow: 0 0 24px rgba(0,245,255,0.55); margin: 10px 0 18px;
}
.laps { max-width: 420px; margin: 18px auto 0; text-align: start; }

.calc {
  max-width: 360px; margin: 0 auto; padding: 16px;
}
.calc-display {
  font-family: 'Orbitron', sans-serif; font-size: 32px; text-align: end;
  padding: 18px 12px; margin-bottom: 12px; min-height: 76px;
  background: rgba(0,0,0,0.35); border-radius: 14px; border: 1px solid var(--line);
  overflow: hidden; word-break: break-all;
}
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calc-grid button {
  height: 56px; border-radius: 14px; border: 1px solid var(--line);
  background: rgba(0,245,255,0.08); color: var(--text); font-size: 18px; font-weight: 600;
}
.calc-grid button.op { color: var(--cyan); }
.calc-grid button.eq { background: linear-gradient(135deg, rgba(0,245,255,0.3), rgba(255,43,214,0.28)); grid-column: span 1; }
.calc-grid button.zero { grid-column: span 2; }

.form-grid { display: grid; gap: 10px; }
.form-grid label { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 10px; border-radius: 99px; font-size: 12px; }
.chip.active { border-color: var(--cyan); background: rgba(0,245,255,0.16); }

.modal-bg {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.55);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-bg.show { display: flex; }
.modal {
  width: min(520px, 100%); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 18px; padding: 18px; box-shadow: 0 0 40px rgba(0,245,255,0.12);
}
.modal h3 { margin-bottom: 12px; }
#toasts { position: fixed; inset-inline-end: 16px; top: 70px; z-index: 30; display: grid; gap: 8px; }
.toast {
  background: #10162e; border: 1px solid var(--cyan); color: var(--text);
  padding: 10px 12px; border-radius: 12px; min-width: 220px;
  box-shadow: 0 0 18px rgba(0,245,255,0.2);
}

.overlay {
  display: none; position: fixed; inset: var(--header-h) 0 var(--nav-h) 0;
  background: rgba(0,0,0,0.45); z-index: 8;
}
@media (max-width: 900px) {
  .stats, .agenda { grid-template-columns: 1fr; }
  #sidebar {
    position: fixed; top: var(--header-h); bottom: var(--nav-h); inset-inline-start: 0;
    z-index: 9; transform: translateX(-105%);
  }
  html[dir="rtl"] #sidebar { transform: translateX(105%); }
  #sidebar.open, html[dir="rtl"] #sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }
}
@media (min-width: 901px) {
  #app { height: calc(100% - var(--header-h)); }
  #bottomNav { display: none; }
  body { --nav-h: 0px; }
}
</style>
</head>
<body>
<div id="topHeader">
  <div id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div class="brand">
    <h1>WORKM PLANNER</h1>
    <span id="tagline">Neon Ultimate Pro</span>
  </div>
  <div class="header-right">
    <div class="live-clock" id="liveClock">--:--:--</div>
    <div class="avatar" id="avatarBtn" onclick="showContent('profile')">W</div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>
<div id="app">
  <div id="sidebar">
    <h2 id="optTitle">Options</h2>
    <button data-page="home" onclick="showContent('home')">🏠 <span data-i18n="home">Home</span></button>
    <button data-page="religion" onclick="showContent('religion')">🕌 <span data-i18n="religion">Religion Schedule</span></button>
    <button data-page="language" onclick="showContent('language')">🌐 <span data-i18n="language">Language</span></button>
    <button data-page="stopwatch" onclick="showContent('stopwatch')">⏱️ <span data-i18n="stopwatch">Stopwatch</span></button>
    <button data-page="calculator" onclick="showContent('calculator')">🧮 <span data-i18n="calculator">Calculator</span></button>
    <button onclick="exportTimetable()">⬇️ <span data-i18n="export">Export</span></button>
    <button onclick="importTimetable()">⬆️ <span data-i18n="import">Import</span></button>
    <button data-page="profile" onclick="showContent('profile')">👤 <span data-i18n="profile">Profile</span></button>
  </div>
  <div id="main"><div id="pageContent"></div></div>
</div>
<div id="bottomNav">
  <button data-page="home" onclick="showContent('home')"><span class="ico">🏠</span><span data-i18n="home">Home</span></button>
  <button data-page="stopwatch" onclick="showContent('stopwatch')"><span class="ico">⏱️</span><span data-i18n="stopwatch">Stopwatch</span></button>
  <button data-page="calculator" onclick="showContent('calculator')"><span class="ico">🧮</span><span data-i18n="calculator">Calculator</span></button>
  <button data-page="profile" onclick="showContent('profile')"><span class="ico">👤</span><span data-i18n="profile">Profile</span></button>
</div>
<div class="modal-bg" id="modalRoot" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toasts"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const STORAGE_KEY = 'workm-planner-v1';
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const I18N = {
  en: {
    home:'Home', religion:'Religion Schedule', language:'Language', stopwatch:'Stopwatch',
    calculator:'Calculator', export:'Export', import:'Import', profile:'Profile',

  },

    chooseLang:'اختر لغتك', name:'الاسم', hours:'ساعات العمل',
    notif:'ذكّرني قبل الحدث بخمس دقائق', clear:'مسح كل البيانات', saved:'تم الحفظ',
    exported:'تم التصدير', imported:'تم الاستيراد', invalid:'ملف غير صالح',

  },
  ur: {
    home:'ہوم', religion:'مذہبی شیڈول', language:'زبان', stopwatch:'اسٹاپ واچ',
    calculator:'کیلکولیٹر', export:'ایکسپورٹ', import:'امپورٹ', profile:'پروفائل',
    tagline:'وقت سنبھالیں، توجہ بچائیں۔', options:'آپشنز',
    greeting: (n,p)=>`${p}، ${n}`,
    morning:'صبح بخیر', afternoon:'دوپہر بخیر', evening:'شام بخیر',
    today:'آج', week:'اس ہفتے', add:'ایونٹ شامل کریں', prev:'پچھلا', next:'اگلا',
    noEvents:'ابھی کوئی ایونٹ نہیں۔ وقت پر ٹیپ کر کے شیڈول بنائیں۔',
    title:'عنوان', date:'تاریخ', start:'شروع', end:'ختم', notes:'نوٹس',
    category:'قسم', recurring:'ہر ہفتے دہرائیں', save:'محفوظ', cancel:'منسوخ',
    delete:'حذف', work:'کام', study:'مطالعہ', personal:'ذاتی', health:'صحت',
    other:'دیگر', religionCat:'مذہب', upcoming:'آج کے کام', weekEvents:'اس ہفتے',
    prayers:'روزانہ نمازیں', customRel:'اضافی مذہبی سرگرمی', addCustom:'شامل کریں',
    chooseLang:'زبان منتخب کریں', name:'نام', hours:'کام کے اوقات',
    notif:'ایونٹ سے ۵ منٹ پہلے یاد دلائیں', clear:'تمام ڈیٹا صاف کریں', saved:'محفوظ ہو گیا',
    exported:'ایکسپورٹ ہو گیا', imported:'امپورٹ ہو گیا', invalid:'غلط فائل',
    startSw:'شروع', pause:'روکیں', lap:'لیپ', reset:'ری سیٹ', laps:'لیپس',
    done:'مکمل', remaining:'باقی', now:'اب', edit:'ایونٹ میں ترمیم'
  }
};

const defaultState = () => ({
  profile: { name: 'Planner', lang: 'en', workStart: '09:00', workEnd: '17:00', notif: false, weekStarts: 'mon' },
  events: [],
  prayers: { fajr:'05:15', dhuhr:'12:30', asr:'16:00', maghrib:'18:45', isha:'20:10' },
  prayerLog: {},
  customReligion: []
});

let state = loadState();
let currentPage = 'home';
let weekOffset = 0;
let sw = { ms: 0, running: false, started: 0, laps: [], timer: null };
let calc = { display: '0', acc: null, op: null, fresh: false };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch { return defaultState(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function t(key) {
  const pack = I18N[state.profile.lang] || I18N.en;
  return pack[key] ?? I18N.en[key] ?? key;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function pad(n, z=2) { return String(n).padStart(z,'0'); }
function todayISO(d=new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function startOfWeek(offset=0) {
  const d = new Date();
  const day = d.getDay(); // 0 sun
  const diff = (day === 0 ? -6 : 1 - day) + offset * 7;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function minutes(t) { const [h,m] = (t||'00:00').split(':').map(Number); return h*60+m; }
function period() {
  const h = new Date().getHours();
  return h < 12 ? t('morning') : h < 17 ? t('afternoon') : t('evening');
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function applyChrome() {
  const lang = state.profile.lang || 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr';
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('optTitle').textContent = t('options');
  document.getElementById('avatarBtn').textContent = (state.profile.name || 'W').trim().charAt(0).toUpperCase();
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('#sidebar [data-page], #bottomNav [data-page]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === currentPage);
  });
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const open = typeof force === 'boolean' ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  document.getElementById('hamburger').classList.toggle('open', open);
  document.getElementById('overlay').classList.toggle('show', open && window.innerWidth <= 900);
}

function showContent(page) {
  currentPage = page;
  if (window.innerWidth <= 900) toggleSidebar(false);
  applyChrome();
  const root = document.getElementById('pageContent');
  const pages = { home: renderHome, religion: renderReligion, language: renderLanguage, stopwatch: renderStopwatch, calculator: renderCalculator, profile: renderProfile };
  (pages[page] || renderHome)(root);
}

function eventsForDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7; // mon=0
  return state.events.filter(ev => ev.recurring ? ev.dow === dow : ev.date === iso)
    .sort((a,b) => minutes(a.start) - minutes(b.start));
}

function renderHome(root) {
  const start = startOfWeek(weekOffset);
  const days = Array.from({length:7}, (_,i) => addDays(start, i));
  const today = todayISO();
  const todays = eventsForDate(today);
  const weekCount = days.reduce((n,d)=> n + eventsForDate(todayISO(d)).length, 0);
  const doneToday = todays.filter(e => e.done).length;

  root.innerHTML = `
    <div class="greeting">
      <h2>${escapeHtml(t('greeting')(state.profile.name || 'Planner', period()))}</h2>
      <p>${new Date().toLocaleDateString(document.documentElement.lang, { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</p>
    </div>
    <div class="stats">
      <div class="card stat"><b>${todays.length}</b><span>${t('today')}</span></div>
      <div class="card stat"><b>${weekCount}</b><span>${t('week')}</span></div>
      <div class="card stat"><b>${doneToday}</b><span>${t('done')}</span></div>
      <div class="card stat"><b>${Math.max(todays.length-doneToday,0)}</b><span>${t('remaining')}</span></div>
    </div>
    <div class="week-bar">
      <button class="ghost" onclick="weekOffset--; showContent('home')">${t('prev')}</button>
      <h3>${start.toLocaleDateString(document.documentElement.lang, {month:'short', day:'numeric'})} — ${addDays(start,6).toLocaleDateString(document.documentElement.lang, {month:'short', day:'numeric'})}</h3>
      <button class="ghost" onclick="weekOffset=0; showContent('home')">${t('today')}</button>
      <button class="ghost" onclick="weekOffset++; showContent('home')">${t('next')}</button>
      <button class="primary" onclick="openEventModal()">${t('add')}</button>
    </div>
    <div class="timetable-wrap card" style="padding:0">
      <div class="timetable">
        <div class="th"></div>
        ${days.map(d => `<div class="th ${todayISO(d)===today?'today':''}">${d.toLocaleDateString(document.documentElement.lang,{weekday:'short'})}<br>${d.getDate()}</div>`).join('')}
        <div>${Array.from({length:16}, (_,h)=>`<div class="time-cell" style="height:var(--hour-h)">${pad(6+h)}:00</div>`).join('')}</div>
        ${days.map((d) => {
          const iso = todayISO(d);
          const evs = eventsForDate(iso);
          return `<div class="day-col" data-date="${iso}">
            ${Array.from({length:16}, (_,h)=>`<div class="hour-slot" onclick="openEventModal({date:'${iso}', start:'${pad(6+h)}:00'})"></div>`).join('')}
            ${evs.map(ev => {
              const top = ((minutes(ev.start) - 6*60) / 60) * 56;
              const height = Math.max(28, ((minutes(ev.end) - minutes(ev.start)) / 60) * 56);
              return `<div class="event cat-${escapeHtml(ev.category||'other')}" style="top:${top}px;height:${height}px" onclick="event.stopPropagation(); openEventModal({id:'${ev.id}'})">
                <strong>${escapeHtml(ev.title)}</strong>
                <small>${escapeHtml(ev.start)}–${escapeHtml(ev.end)}</small>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="agenda">
      <div class="card">
        <h3 style="margin-bottom:10px">${t('upcoming')}</h3>
        ${todays.length ? todays.map(ev => `
          <div class="item" onclick="openEventModal({id:'${ev.id}'})">
            <div class="dot" style="background:var(--cyan)"></div>
            <div style="flex:1">
              <strong>${escapeHtml(ev.title)}</strong>
              <div style="color:var(--muted);font-size:12px">${escapeHtml(ev.start)} – ${escapeHtml(ev.end)}</div>
            </div>
            <input type="checkbox" ${ev.done?'checked':''} onclick="event.stopPropagation(); toggleDone('${ev.id}')">
          </div>`).join('') : `<div class="empty">${t('noEvents')}</div>`}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px">${t('now')}</h3>
        <p style="color:var(--muted);font-size:13px">${t('hours')}: ${escapeHtml(state.profile.workStart)} – ${escapeHtml(state.profile.workEnd)}</p>
        <div class="progress-bar" style="margin-top:12px"><span style="width:${Math.min(100, Math.max(0, ((new Date().getHours()*60+new Date().getMinutes()-minutes(state.profile.workStart)) / (minutes(state.profile.workEnd)-minutes(state.profile.workStart)||1))*100))}%"></span></div>
        <button class="primary" style="width:100%;margin-top:8px" onclick="openEventModal()">${t('add')}</button>
      </div>
    </div>
  `;
}

function toggleDone(id) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  ev.done = !ev.done;
  save(); showContent('home');
}

function openEventModal(opts={}) {
  const existing = opts.id ? state.events.find(e => e.id === opts.id) : null;
  const ev = existing || {
    id: '', title: '', date: opts.date || todayISO(), start: opts.start || '09:00',
    end: opts.end || '10:00', category: 'work', notes: '', recurring: false, dow: 0, done: false
  };
  const cats = ['work','study','personal','health','religion','other'];
  document.getElementById('modalBox').innerHTML = `
    <h3>${existing ? t('edit') : t('add')}</h3>
    <div class="form-grid">
      <label>${t('title')}<input id="evTitle" value="${escapeHtml(ev.title)}" placeholder="Deep work"></label>
      <div class="row">
        <label style="flex:1">${t('date')}<input id="evDate" type="date" value="${escapeHtml(ev.date || todayISO())}"></label>
        <label style="flex:1">${t('start')}<input id="evStart" type="time" value="${escapeHtml(ev.start)}"></label>
        <label style="flex:1">${t('end')}<input id="evEnd" type="time" value="${escapeHtml(ev.end)}"></label>
      </div>
      <label>${t('category')}
        <div class="chips" id="evCats">
          ${cats.map(c => `<button type="button" class="chip ${ev.category===c?'active':''}" data-cat="${c}" onclick="selectCat(this)">${t(c==='religion'?'religionCat':c)}</button>`).join('')}
        </div>
      </label>
      <label>${t('notes')}<textarea id="evNotes" rows="3">${escapeHtml(ev.notes||'')}</textarea></label>
      <label style="display:flex;align-items:center;gap:8px;grid-auto-flow:column">
        <input type="checkbox" id="evRec" ${ev.recurring?'checked':''}> ${t('recurring')}
      </label>
      <div class="row" style="justify-content:flex-end">
        <button class="ghost" onclick="closeModal()">${t('cancel')}</button>
        ${existing ? `<button class="danger" onclick="deleteEvent('${ev.id}')">${t('delete')}</button>` : ''}
        <button class="primary" onclick="saveEvent('${existing?ev.id:''}')">${t('save')}</button>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').classList.add('show');
}
function selectCat(btn) {
  document.querySelectorAll('#evCats .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}
function closeModal() { document.getElementById('modalRoot').classList.remove('show'); }
function saveEvent(id) {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { toast(t('title')); return; }
  const date = document.getElementById('evDate').value;
  const start = document.getElementById('evStart').value;
  const end = document.getElementById('evEnd').value;
  if (minutes(end) <= minutes(start)) { toast(t('end')); return; }
  const category = document.querySelector('#evCats .chip.active')?.dataset.cat || 'other';
  const notes = document.getElementById('evNotes').value;
  const recurring = document.getElementById('evRec').checked;
  const dow = (new Date(date+'T00:00:00').getDay() + 6) % 7;
  if (id) {
    const ev = state.events.find(e => e.id === id);
    Object.assign(ev, { title, date, start, end, category, notes, recurring, dow });
  } else {
    state.events.push({ id: uid(), title, date, start, end, category, notes, recurring, dow, done: false });
  }
  save(); closeModal(); toast(t('saved')); showContent('home');
}
function deleteEvent(id) {
  state.events = state.events.filter(e => e.id !== id);
  save(); closeModal(); showContent('home');
}

function renderReligion(root) {
  const names = { fajr:'Fajr', dhuhr:'Dhuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha' };
  const today = todayISO();
  state.prayerLog[today] = state.prayerLog[today] || {};
  const log = state.prayerLog[today];
  const done = Object.values(names).filter((_,i)=> log[Object.keys(names)[i]]).length;
  root.innerHTML = `
    <div class="greeting"><h2>${t('religion')}</h2><p>${t('prayers')} — ${done}/5 ${t('done')}</p></div>
    <div class="progress-bar"><span style="width:${(done/5)*100}%"></span></div>
    <div class="card" style="margin-bottom:16px">
      ${Object.keys(names).map(k => `
        <div class="prayer">
          <input type="checkbox" ${log[k]?'checked':''} onchange="togglePrayer('${k}', this.checked)">
          <div><strong>${names[k]}</strong></div>
          <input type="time" value="${escapeHtml(state.prayers[k])}" onchange="setPrayerTime('${k}', this.value)">
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="week-bar"><h3>${t('customRel')}</h3><button class="primary" onclick="addCustomRel()">${t('addCustom')}</button></div>
      ${(state.customReligion||[]).length ? state.customReligion.map(c => `
        <div class="item">
          <div class="dot" style="background:var(--gold)"></div>
          <div style="flex:1">
            <input value="${escapeHtml(c.title)}" onchange="updateCustomRel('${c.id}','title',this.value)" style="width:100%;margin-bottom:6px">
            <input type="time" value="${escapeHtml(c.time)}" onchange="updateCustomRel('${c.id}','time',this.value)">
          </div>
          <button class="danger" onclick="delCustomRel('${c.id}')">${t('delete')}</button>
        </div>`).join('') : `<div class="empty">${t('noEvents')}</div>`}
    </div>
  `;
}
function togglePrayer(k, val) {
  const today = todayISO();
  state.prayerLog[today] = state.prayerLog[today] || {};
  state.prayerLog[today][k] = val;
  save(); showContent('religion');
}
function setPrayerTime(k, val) { state.prayers[k] = val; save(); }
function addCustomRel() {
  state.customReligion.push({ id: uid(), title: t('customRel'), time: '20:30' });
  save(); showContent('religion');
}
function updateCustomRel(id, field, val) {
  const c = state.customReligion.find(x => x.id === id);
  if (c) { c[field] = val; save(); }
}
function delCustomRel(id) {
  state.customReligion = state.customReligion.filter(x => x.id !== id);
  save(); showContent('religion');
}

function renderLanguage(root) {
  const langs = [
    { id:'en', name:'English', native:'English' },
    { id:'ar', name:'Arabic', native:'العربية' },
    { id:'ur', name:'Urdu', native:'اردو' }
  ];
  root.innerHTML = `
    <div class="greeting"><h2>${t('language')}</h2><p>${t('chooseLang')}</p></div>
    <div class="lang-grid">
      ${langs.map(l => `
        <div class="card lang-card ${state.profile.lang===l.id?'active':''}" onclick="setLang('${l.id}')">
          <b>${l.native}</b>
          <span style="color:var(--muted)">${l.name}</span>
        </div>`).join('')}
    </div>
  `;
}
function setLang(id) {
  state.profile.lang = id;
  save(); applyChrome(); showContent('language');
}

function renderStopwatch(root) {
  root.innerHTML = `
    <div class="card stopwatch">
      <h2>${t('stopwatch')}</h2>
      <div class="sw-time" id="swTime">${fmtSw(sw.ms)}</div>
      <div class="row" style="justify-content:center">
        <button class="primary" id="swToggle" onclick="toggleSw()">${sw.running ? t('pause') : t('startSw')}</button>
        <button class="ghost" onclick="lapSw()">${t('lap')}</button>
        <button class="danger" onclick="resetSw()">${t('reset')}</button>
      </div>
      <div class="laps" id="swLaps">${renderLaps()}</div>
    </div>
  `;
}
function fmtSw(ms) {
  const cs = Math.floor(ms / 10) % 100;
  const s = Math.floor(ms / 1000) % 60;
  const m = Math.floor(ms / 60000) % 60;
  const h = Math.floor(ms / 3600000);
  return `${pad(h)}:${pad(m)}:${pad(s)}.${pad(cs)}`;
}
function renderLaps() {
  if (!sw.laps.length) return '';
  return `<h3 style="margin-bottom:8px">${t('laps')}</h3>` + sw.laps.map((l,i)=>`<div class="item"><span>#${i+1}</span><strong style="margin-inline-start:auto">${fmtSw(l)}</strong></div>`).join('');
}
function tickSw() {
  if (!sw.running) return;
  sw.ms = Date.now() - sw.started;
  const el = document.getElementById('swTime');
  if (el) el.textContent = fmtSw(sw.ms);
}
function toggleSw() {
  if (sw.running) {
    sw.running = false;
    sw.ms = Date.now() - sw.started;
    clearInterval(sw.timer);
  } else {
    sw.running = true;
    sw.started = Date.now() - sw.ms;
    sw.timer = setInterval(tickSw, 30);
  }
  if (currentPage === 'stopwatch') showContent('stopwatch');
}
function lapSw() { if (sw.ms) { sw.laps.unshift(sw.ms); if (currentPage==='stopwatch') showContent('stopwatch'); } }
function resetSw() {
  sw.running = false; sw.ms = 0; sw.laps = []; clearInterval(sw.timer);
  if (currentPage === 'stopwatch') showContent('stopwatch');
}

function renderCalculator(root) {
  const keys = [
    ['C','±','%','÷'],
    ['7','8','9','×'],
    ['4','5','6','−'],
    ['1','2','3','+'],
    ['0','.','=']
  ];
  root.innerHTML = `
    <div class="card calc">
      <h2 style="margin-bottom:10px">${t('calculator')}</h2>
      <div class="calc-display" id="calcDisplay">${escapeHtml(calc.display)}</div>
      <div class="calc-grid">
        ${keys.flat().map(k => {
          const cls = k==='0' ? 'zero' : k==='=' ? 'eq' : '÷×−+%±C'.includes(k) ? 'op' : '';
          return `<button class="${cls}" onclick="calcPress('${k}')">${k}</button>`;
        }).join('')}
      </div>
    </div>
  `;
}
function calcPress(k) {
  const ops = { '÷':'/', '×':'*', '−':'-', '+':'+' };
  if (k === 'C') { calc = { display:'0', acc:null, op:null, fresh:false }; }
  else if (k === '±') { calc.display = String(-(parseFloat(calc.display)||0)); }
  else if (k === '%') { calc.display = String((parseFloat(calc.display)||0)/100); }
  else if (k === '.') { if (!calc.display.includes('.')) calc.display += '.'; }
  else if (ops[k]) {
    compute();
    calc.op = ops[k];
    calc.acc = parseFloat(calc.display);
    calc.fresh = true;
  } else if (k === '=') { compute(); calc.op = null; calc.acc = null; calc.fresh = true; }
  else {
    if (calc.display === '0' || calc.fresh) { calc.display = k; calc.fresh = false; }
    else calc.display += k;
  }
  const el = document.getElementById('calcDisplay');
  if (el) el.textContent = calc.display;
}
function compute() {
  if (calc.acc == null || !calc.op) return;
  const b = parseFloat(calc.display);
  let r = calc.acc;
  if (calc.op === '+') r += b;
  if (calc.op === '-') r -= b;
  if (calc.op === '*') r *= b;
  if (calc.op === '/') r = b === 0 ? 'Error' : r / b;
  calc.display = String(Math.round((Number(r)+Number.EPSILON)*1e10)/1e10);
}

function renderProfile(root) {
  root.innerHTML = `
    <div class="greeting"><h2>${t('profile')}</h2><p>${t('tagline')}</p></div>
    <div class="card form-grid">
      <label>${t('name')}<input id="pfName" value="${escapeHtml(state.profile.name)}"></label>
      <div class="row">
        <label style="flex:1">${t('start')}<input id="pfStart" type="time" value="${escapeHtml(state.profile.workStart)}"></label>
        <label style="flex:1">${t('end')}<input id="pfEnd" type="time" value="${escapeHtml(state.profile.workEnd)}"></label>
      </div>
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="pfNotif" ${state.profile.notif?'checked':''}> ${t('notif')}
      </label>
      <div class="row">
        <button class="primary" onclick="saveProfile()">${t('save')}</button>
        <button class="ghost" onclick="exportTimetable()">${t('export')}</button>
        <button class="ghost" onclick="importTimetable()">${t('import')}</button>
        <button class="danger" onclick="clearAll()">${t('clear')}</button>
      </div>
    </div>
  `;
}
function saveProfile() {
  state.profile.name = document.getElementById('pfName').value.trim() || 'Planner';
  state.profile.workStart = document.getElementById('pfStart').value;
  state.profile.workEnd = document.getElementById('pfEnd').value;
  state.profile.notif = document.getElementById('pfNotif').checked;
  if (state.profile.notif && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  save(); applyChrome(); toast(t('saved'));
}
function clearAll() {
  if (!confirm(t('clear') + '?')) return;
  state = defaultState();
  save(); applyChrome(); showContent('profile');
}

function exportTimetable() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workm-timetable-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t('exported'));
}
function importTimetable() { document.getElementById('importFile').click(); }
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object') throw new Error('bad');
    state = { ...defaultState(), ...data, profile: { ...defaultState().profile, ...(data.profile||{}) } };
    if (!Array.isArray(state.events)) state.events = [];
    save(); applyChrome(); showContent(currentPage); toast(t('imported'));
  } catch { toast(t('invalid')); }
});

function tickClock() {
  const n = new Date();
  document.getElementById('liveClock').textContent = n.toLocaleTimeString(document.documentElement.lang, { hour12:false });
}
setInterval(tickClock, 1000);
tickClock();

const notified = new Set();
setInterval(() => {
  if (!state.profile.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const iso = todayISO(now);
  const soon = minutes(`${pad(now.getHours())}:${pad(now.getMinutes())}`) + 5;
  eventsForDate(iso).forEach(ev => {
    if (minutes(ev.start) === soon && !notified.has(iso+ev.id)) {
      notified.add(iso+ev.id);
      new Notification('Workm Planner', { body: `${ev.title} • ${ev.start}` });
    }
  });
}, 30000);

applyChrome();
showContent('home');
</script>
